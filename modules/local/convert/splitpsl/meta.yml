# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "convert_splitpsl"
description: Split a PSL file into tiles of target sequence chunks x query sequence chunks
keywords:
  - psl
  - split
  - chain
tools:
  - gawk:
      description: |
        GNU awk writes each PSL record to the tile of its target sequence's chunk and its query sequence's chunk,
        tiles/t<i>_q<j>.psl, in one pass over the PSL. Tiles without records are not written; without any record
        the output is one empty tile, tiles/empty.psl.
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      tool_dev_url: "https://git.savannah.gnu.org/cgit/gawk.git"
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'target_query' ]`
    - psl:
        type: file
        description: PSL alignments, plain or gzipped
        pattern: "*.{psl,psl.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3007 # PSL
    - target_chunks:
        type: list
        description: Chunks of target sequences, each a list of sequence names; every target sequence of the PSL must be in one
    - query_chunks:
        type: list
        description: Chunks of query sequences, each a list of sequence names; every query sequence of the PSL must be in one
output:
  psl:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'target_query' ]`
      - "tiles/*.psl":
          type: file
          description: PSL records of one target chunk and one query chunk (t<i>_q<j>.psl), or one empty tile (empty.psl)
          pattern: "tiles/*.psl"
          ontologies:
            - edam: http://edamontology.org/format_3007 # PSL
  versions_gawk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - "awk -Wversion | sed '1!d; s/.*Awk //; s/,.*//'":
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - "awk -Wversion | sed '1!d; s/.*Awk //; s/,.*//'":
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@da-bar"
maintainers:
  - "@da-bar"
